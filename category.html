<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoZa Category</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="music.css">
</head>
<body class="category-page">
    <div class="app-shell">
        <header class="topbar">
            <div class="brand-cluster">
                <a class="icon-pill brand-mark" href="music.html" aria-label="EchoZa home">
                    <i class="fas fa-wave-square"></i>
                </a>
                <a class="icon-pill" href="music.html" aria-label="Back to home">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <label class="search-pill" for="categorySearchInput">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="text" id="categorySearchInput" placeholder="Search another category or song">
                    <span class="search-shortcut">/</span>
                </label>
            </div>
            <nav class="top-links">
                <a href="music.html">Home</a>
                <a href="#categoryResults">Results</a>
            </nav>
            <div class="top-actions">
                <button class="solid-btn" id="openCategoryBtn" type="button">Open</button>
            </div>
        </header>

        <main class="category-layout">
            <section class="panel category-hero">
                <p class="eyebrow">EchoZa Category</p>
                <h1 id="categoryTitle">Category</h1>
                <p class="hero-text" id="categoryDescription">Results for your selected category.</p>
            </section>

            <section class="panel full-library" id="categoryResults">
                <div class="panel-heading">
                    <h2 id="resultHeading">Songs</h2>
                    <a class="text-link" href="music.html">Back to home</a>
                </div>
                <div class="song-grid" id="categorySongGrid"></div>
            </section>
        </main>
    </div>

    <footer class="player-bar">
        <div class="now-playing">
            <div class="cover-orb" id="playerCover"></div>
            <div class="track-meta">
                <strong id="currentSongTitle">Choose a song</strong>
                <span id="currentSongArtist">Category player</span>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" id="prevBtn" type="button" aria-label="Previous">
                    <i class="fas fa-backward-step"></i>
                </button>
                <button class="play-main" id="playPauseBtn" type="button" aria-label="Play or pause">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                <button class="control-btn" id="nextBtn" type="button" aria-label="Next">
                    <i class="fas fa-forward-step"></i>
                </button>
            </div>
            <div class="progress-wrap">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progress"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="player-side">
            <a class="icon-action" href="music.html" title="Back to home">
                <i class="fas fa-house"></i>
            </a>
        </div>
    </footer>

    <script src="songs/library.js"></script>
    <script src="category.js"></script>
</body>
</html>
